<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill doahoacoccan</title>
  
  <!-- Font chữ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
  
  <!-- Thư viện Xuất Ảnh HTML2Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Link File CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANEL NHẬP DỮ LIỆU -->
  <div class="editor-panel">
    <h2>Nhập Thông Tin Hóa Đơn</h2>
    
    <div class="form-group">
      <label>Tên Dự Án / Tiêu Đề Phụ</label>
      <input type="text" id="in-sub-title" value="Foodtruck chú Thơm" oninput="updateInvoice()" />
    </div>

    <!-- DANH SÁCH HẠNG MỤC -->
    <label style="font-size:0.85rem; font-weight:600; margin-top:10px; display:block;">Danh Sách Hạng Mục</label>
    <table class="items-table-input">
      <thead>
        <tr>
          <th>Hạng mục</th>
          <th width="60">SL</th>
          <th width="100">Đơn giá</th>
          <th width="40"></th>
        </tr>
      </thead>
      <tbody id="input-items-body"></tbody>
    </table>
    <button class="btn btn-add" onclick="addItem()">+ Thêm Hạng Mục</button>

    <!-- TÊN DÒNG GIẢM GIÁ -->
    <div class="form-group">
      <label>Giảm Giá (Nếu có)</label>
      <input type="text" id="in-discount-name" value="Giảm giá cho chú Thơm" oninput="updateInvoice()" />
    </div>

    <!-- MỨC GIẢM GIÁ -->
    <div class="form-group">
      <label>Mức Giảm Giá</label>
      <div class="radio-group">
        <label><input type="radio" name="discount-type" value="fixed" checked onchange="updateInvoice()"> Số tiền cố định (VNĐ)</label>
        <label><input type="radio" name="discount-type" value="percent" onchange="updateInvoice()"> Giảm theo %</label>
      </div>
      <input type="number" id="in-discount-val" value="800000" oninput="updateInvoice()" placeholder="Nhập số tiền hoặc số %" />
    </div>

    <div class="form-group">
      <label>Số Tiền Đã Cọc (VNĐ)</label>
      <input type="number" id="in-deposit-val" value="0" oninput="updateInvoice()" />
    </div>

<!-- MỚI: Cụm 2 nút bấm -->
<div class="action-buttons">
  <button class="btn btn-export" onclick="exportImage()">Download</button>
  <button class="btn btn-copy" onclick="copyImageToClipboard()">Copy</button>
</div>
  </div>

  <!-- BẢN XEM TRƯỚC HÓA ĐƠN -->
  <div class="preview-container">
    <div id="invoice">
      
      <!-- HEADER -->
      <div class="inv-header">
        <div class="inv-header-left">
          <div class="inv-title-main">BÁO GIÁ</div>
          <div class="inv-title-sub" id="out-sub-title">Foodtruck chú Thơm</div>
        </div>
        <div class="inv-brand">
          <img src="logo.png" alt="Logo" class="inv-logo-img" />
        </div>
      </div>

      <!-- BẢNG HẠNG MỤC -->
      <table class="inv-table">
        <thead>
          <tr>
            <th class="col-item">Hạng mục</th>
            <th class="col-qty">Số lượng</th>
            <th class="col-price">Giá</th>
          </tr>
        </thead>
        <tbody id="out-items-body"></tbody>
      </table>

      <!-- FOOTER (QR + TỔNG TIỀN) -->
      <div class="inv-footer">
        <div class="inv-qr-box">
          <img src="qr.png" alt="Mã QR" class="inv-qr-img" />
        </div>

        <table class="inv-summary">
          <tr class="row-total">
            <td>Tổng tiền</td>
            <td id="out-total">0</td>
          </tr>
          <tr class="row-discount" id="row-discount-box">
            <td id="out-discount-name">Giảm giá cho chú Thơm</td>
            <td id="out-discount-val">0</td>
          </tr>
          <tr class="row-deposit" id="row-deposit-box">
            <td>Đã cọc</td>
            <td id="out-deposit-val">0</td>
          </tr>
          <tr class="row-balance">
            <td>Còn</td>
            <td id="out-balance">0</td>
          </tr>
        </table>
      </div>

    </div>
  </div>

  <!-- Link File JS -->
  <script src="script.js"></script>
</body>
</html>
